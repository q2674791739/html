<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KL-TK Hub</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}

  :root{
    --neon-cyan: #00e5ff;
    --neon-purple: #a855f7;
    --neon-pink: #ec4899;
    --bg-deep: #050510;
    --glass: rgba(255,255,255,0.03);
    --glass-border: rgba(255,255,255,0.08);
  }

  html,body{height:100%}
  body{
    font-family: -apple-system, "SF Pro Display", "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg-deep);
    color: #e2e8f0;
    overflow-x: hidden;
    position: relative;
    min-height: 100vh;
  }

  /* ═══ 背景层 ═══ */
  .bg-grid{
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.06) 1px, transparent 1px);
    background-size: 42px 42px;
    background-position: center center;
    z-index: 0;
    pointer-events: none;
  }

  .bg-glow{
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 15% 20%, rgba(168,85,247,0.18), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(0,229,255,0.15), transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(236,72,153,0.08), transparent 60%);
    z-index: 1;
    pointer-events: none;
  }

  .bg-vignette{
    position: fixed; inset: 0;
    background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.55) 100%);
    z-index: 2;
    pointer-events: none;
  }

  /* ═══ 主容器 ═══ */
  .container{
    position: relative;
    z-index: 10;
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* ═══ 顶部导航 ═══ */
  .nav{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 60px;
  }

  .brand{
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 1px;
  }

  .brand-dot{
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--neon-cyan);
    box-shadow:
      0 0 10px var(--neon-cyan),
      0 0 20px var(--neon-cyan);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.6;transform:scale(.85)}
  }

  .brand-text{
    background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .tabs{
    display: flex;
    gap: 8px;
    padding: 5px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .tab{
    padding: 8px 22px;
    font-size: 14px;
    font-weight: 500;
    color: #94a3b8;
    border-radius: 10px;
    cursor: pointer;
    transition: all .25s ease;
    user-select: none;
  }

  .tab:hover{color: #e2e8f0}

  .tab.active{
    color: #fff;
    background: linear-gradient(135deg, rgba(0,229,255,0.18), rgba(168,85,247,0.18));
    box-shadow:
      0 0 20px rgba(0,229,255,0.15),
      inset 0 0 12px rgba(0,229,255,0.1);
  }

  /* ═══ 页面切换 ═══ */
  .page{
    display: none;
    animation: fadeSlide .4s cubic-bezier(.16,1,.3,1);
  }

  .page.active{display: block}

  @keyframes fadeSlide{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:translateY(0)}
  }

  /* ═══ 主页 ═══ */
  .hero-title{
    font-size: 34px;
    font-weight: 800;
    margin-bottom: 10px;
    letter-spacing: -0.5px;
  }

  .hero-title .gradient{
    background: linear-gradient(120deg, var(--neon-cyan) 0%, var(--neon-purple) 55%, var(--neon-pink) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .hero-sub{
    font-size: 14px;
    color: #64748b;
    margin-bottom: 40px;
    letter-spacing: 0.3px;
  }

  /* ═══ 卡片网格布局 ═══ */
  .cards-grid{
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }

  @media (min-width: 768px){
    .cards-grid{
      grid-template-columns: 1fr 1fr;
    }
  }

  /* ═══ 统计卡片 ═══ */
  .stat-card{
    position: relative;
    padding: 40px 44px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    overflow: hidden;
    transition: border-color .4s ease, box-shadow .4s ease;
  }

  .stat-card::before{
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 24px;
    padding: 1px;
    background: linear-gradient(135deg,
      rgba(0,229,255,0.4),
      rgba(168,85,247,0.4) 50%,
      rgba(236,72,153,0.4));
    -webkit-mask:
      linear-gradient(#fff 0 0) content-box,
      linear-gradient(#fff 0 0);
    mask:
      linear-gradient(#fff 0 0) content-box,
      linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    opacity: .6;
  }

  .stat-card:hover{
    box-shadow:
      0 0 40px rgba(0,229,255,0.12),
      0 0 80px rgba(168,85,247,0.08);
  }

  .stat-label{
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: #94a3b8;
    margin-bottom: 20px;
    letter-spacing: 0.3px;
  }

  .stat-label-icon{
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--neon-cyan);
    box-shadow: 0 0 8px var(--neon-cyan);
  }

  .stat-value{
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  .stat-number{
    font-size: 72px;
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -2px;
    background: linear-gradient(135deg, #fff 0%, var(--neon-cyan) 60%, var(--neon-purple) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 60px rgba(0,229,255,0.3);
  }

  .stat-unit{
    font-size: 15px;
    color: #64748b;
    font-weight: 500;
    letter-spacing: 0.5px;
  }

  /* ═══ 状态条 ═══ */
  .status-bar{
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: #64748b;
  }

  .status-left{
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot{
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #64748b;
    transition: all .3s ease;
  }

  .status-dot.ok{
    background: #10b981;
    box-shadow: 0 0 10px #10b981;
  }

  .status-dot.err{
    background: #ef4444;
    box-shadow: 0 0 10px #ef4444;
  }

  .status-dot.loading{
    background: var(--neon-cyan);
    box-shadow: 0 0 10px var(--neon-cyan);
    animation: pulse 1.2s ease-in-out infinite;
  }

  .refresh-btn{
    padding: 6px 16px;
    font-size: 12px;
    color: #94a3b8;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    cursor: pointer;
    transition: all .2s ease;
    font-family: inherit;
  }

  .refresh-btn:hover{
    color: var(--neon-cyan);
    border-color: rgba(0,229,255,0.4);
    box-shadow: 0 0 16px rgba(0,229,255,0.2);
  }

  .refresh-btn:active{transform: scale(.96)}

  /* ═══ 信息页（空壳）═══ */
  .placeholder{
    padding: 60px 30px;
    background: var(--glass);
    border: 1px dashed rgba(255,255,255,0.1);
    border-radius: 20px;
    text-align: center;
    color: #475569;
    font-size: 14px;
  }

  /* ═══ 底部 ═══ */
  .footer{
    margin-top: 60px;
    text-align: center;
    font-size: 12px;
    color: #334155;
    letter-spacing: 0.5px;
  }

  .footer .accent{
    color: var(--neon-cyan);
    opacity: .7;
  }

  @media (max-width: 640px){
    .container{padding: 24px 16px 60px}
    .nav{flex-direction: column; gap: 16px; align-items: flex-start}
    .stat-card{padding: 28px 24px}
    .stat-number{font-size: 52px}
    .hero-title{font-size: 26px}
  }
 </style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="bg-vignette"></div>

<div class="container">

  <!-- ═══ 导航 ═══ -->
  <div class="nav">
    <div class="brand">
      <div class="brand-dot"></div>
      <span class="brand-text">KL-TK HUB</span>
    </div>
    <div class="tabs">
      <div class="tab active" data-page="home">主页</div>
      <div class="tab" data-page="info">信息</div>
    </div>
  </div>

  <!-- ═══ 主页 ═══ -->
  <div class="page active" id="page-home">
    <div class="hero-title">
      <span class="gradient">脚本统计</span>
    </div>
    <div class="hero-sub">Real-time execution counter</div>

    <!-- 卡片网格 -->
    <div class="cards-grid">
      
      <!-- 烤或死 -->
      <div class="stat-card">
        <div class="stat-label">
          <div class="stat-label-icon"></div>
          <span>烤或死.lua 执行次数</span>
        </div>
        <div class="stat-value">
          <div class="stat-number" id="count-bake">--</div>
          <div class="stat-unit">次</div>
        </div>
        <div class="status-bar">
          <div class="status-left">
            <div class="status-dot loading" id="statusDot-bake"></div>
            <span id="statusText-bake">正在连接...</span>
          </div>
          <button class="refresh-btn" onclick="loadSingleCount('bake')">刷新</button>
        </div>
      </div>

      <!-- 彩虹朋友 -->
      <div class="stat-card">
        <div class="stat-label">
          <div class="stat-label-icon" style="background: var(--neon-pink); box-shadow: 0 0 8px var(--neon-pink);"></div>
          <span>彩虹朋友.lua 执行次数</span>
        </div>
        <div class="stat-value">
          <div class="stat-number" id="count-rainbow">--</div>
          <div class="stat-unit">次</div>
        </div>
        <div class="status-bar">
          <div class="status-left">
            <div class="status-dot loading" id="statusDot-rainbow"></div>
            <span id="statusText-rainbow">正在连接...</span>
          </div>
          <button class="refresh-btn" onclick="loadSingleCount('rainbow')">刷新</button>
        </div>
      </div>

    </div>
  </div>

  <!-- ═══ 信息页（占位）═══ -->
  <div class="page" id="page-info">
    <div class="hero-title">
      <span class="gradient">信息</span>
    </div>
    <div class="hero-sub">待添加</div>

    <div class="placeholder">
      这个页面还没有内容<br>
      等我告诉你放什么
    </div>
  </div>

  <div class="footer">
    © 2024 <span class="accent">KL-TK HUB</span> · Powered by Abacus
  </div>

</div>

<script>
// ═══ 配置（Abacus）═══
const NAMESPACE = 'kl-tk-hub';
const REFRESH_MS = 20000;

// 定义所有脚本的 key 和界面元素 ID
const SCRIPTS = {
  bake: {
    key: 'bake_or_die_loads',
    countEl: 'count-bake',
    dotEl: 'statusDot-bake',
    txtEl: 'statusText-bake'
  },
  rainbow: {
    key: 'rainbow_friends_loads',
    countEl: 'count-rainbow',
    dotEl: 'statusDot-rainbow',
    txtEl: 'statusText-rainbow'
  }
};

// ═══ 页面切换 ═══
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

    tab.classList.add('active');
    document.getElementById('page-' + tab.dataset.page).classList.add('active');
  });
});

// ═══ 单个统计加载 ═══
async function loadSingleCount(type){
  const config = SCRIPTS[type];
  if(!config) return;

  const el = document.getElementById(config.countEl);
  const dot = document.getElementById(config.dotEl);
  const txt = document.getElementById(config.txtEl);
  const api = `https://abacus.jasoncameron.dev/get/${NAMESPACE}/${config.key}`;

  dot.className = 'status-dot loading';
  txt.textContent = '正在获取数据...';

  try{
    const r = await fetch(api);
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();

    // Abacus 返回格式: { value: 数字 } 或 { count: 数字 }
    const num = data.value ?? data.count ?? 0;
    animateCount(num, config.countEl);

    dot.className = 'status-dot ok';
    txt.textContent = '已更新 · ' + new Date().toLocaleTimeString('zh-CN');
  }catch(e){
    dot.className = 'status-dot err';
    txt.textContent = '获取失败：' + e.message;
  }
}

// ═══ 全部加载 ═══
function loadAllCounts(){
  loadSingleCount('bake');
  loadSingleCount('rainbow');
}

// ═══ 数字动画 ═══
function animateCount(target, elementId){
  const el = document.getElementById(elementId);
  const start = parseInt(el.textContent.replace(/,/g,'')) || 0;
  if(start === target){
    el.textContent = target.toLocaleString();
    return;
  }

  const duration = 700;
  const t0 = performance.now();

  function step(now){
    const p = Math.min((now - t0) / duration, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    const v = Math.floor(start + (target - start) * eased);
    el.textContent = v.toLocaleString();
    if(p < 1) requestAnimationFrame(step);
    else el.textContent = target.toLocaleString();
  }
  requestAnimationFrame(step);
}

// ═══ 启动 ═══
loadAllCounts();
setInterval(loadAllCounts, REFRESH_MS);
</script>

</body>
</html>
